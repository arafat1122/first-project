<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dancing Love Animation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: radial-gradient(circle, #1a0011 0%, #000000 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        .container {
            position: relative;
            z-index: 2;
            text-align: center;
            pointer-events: none;
        }
        h1 {
            color: #ff3366;
            font-size: 3rem;
            text-shadow: 0 0 20px rgba(255, 51, 102, 0.8);
            animation: pulse 1.5s infinite alternate ease-in-out;
            margin-bottom: 10px;
        }
        p {
            color: #ff99bb;
            font-size: 1.2rem;
            opacity: 0.8;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.08); }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Dancing Love</h1>
        <p>Move your mouse or tap the screen</p>
    </div>

    <canvas id="loveCanvas"></canvas>

    <script>
        const canvas = document.getElementById('loveCanvas');
        const ctx = canvas.getContext('2d');

        let particles = [];
        const colors = ['#ff0055', '#ff3300', '#ff66aa', '#ff00aa', '#ff99bb'];

        // Resize canvas
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // Heart Shape Formula
        function drawHeart(ctx, x, y, size) {
            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.bezierCurveTo(x - size / 2, y - size / 2, x - size, y + size / 3, x, y + size);
            ctx.bezierCurveTo(x + size, y + size / 3, x + size / 2, y - size / 2, x, y);
            ctx.closePath();
            ctx.fill();
        }

        // Particle Class
        class HeartParticle {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.size = Math.random() * 15 + 10;
                this.speedX = (Math.random() - 0.5) * 4;
                this.speedY = (Math.random() - 0.5) * 4 - 2; // Upward bias
                this.color = colors[Math.floor(Math.random() * colors.length)];
                this.alpha = 1;
                this.decay = Math.random() * 0.015 + 0.005;
                this.angle = Math.random() * Math.PI * 2;
                this.danceSpeed = Math.random() * 0.05 + 0.02;
            }

            update() {
                this.x += this.speedX + Math.sin(this.angle) * 1.5; // Swaying dance movement
                this.y += this.speedY;
                this.angle += this.danceSpeed;
                this.alpha -= this.decay;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 15;
                ctx.shadowColor = this.color;
                drawHeart(ctx, this.x, this.y, this.size);
                ctx.restore();
            }
        }

        // Spawn particles on mouse move
        window.addEventListener('mousemove', (e) => {
            for (let i = 0; i < 2; i++) {
                particles.push(new HeartParticle(e.clientX, e.clientY));
            }
        });

        // Spawn particles on mobile touch
        window.addEventListener('touchmove', (e) => {
            const touch = e.touches[0];
            for (let i = 0; i < 2; i++) {
                particles.push(new HeartParticle(touch.clientX, touch.clientY));
            }
        });

        // Ambient automatic spawning (center dancing hearts)
        function spawnAmbient() {
            if (particles.length < 100) {
                const cx = canvas.width / 2 + Math.sin(Date.now() * 0.002) * 200;
                const cy = canvas.height / 2 + Math.cos(Date.now() * 0.001) * 100;
                particles.push(new HeartParticle(cx, cy));
            }
        }

        // Animation Loop
        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            spawnAmbient();

            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                particles[i].draw();

                if (particles[i].alpha <= 0) {
                    particles.splice(i, 1);
                }
            }

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
